services:
  - type: web
    name: atmosense-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ATMOSENSE_DATA_MODE
        value: DEMO
      - key: ATMOSENSE_CORS_ORIGINS
        value: "*"
